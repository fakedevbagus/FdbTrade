# FdbTrade rebuild CI (R0.3).
# One required, blocking entry point performs the frozen install and every
# bounded verification stage. The runner emits honest pass/fail/timeout/skip
# evidence and never treats a partial diagnostic as a pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: reproducible-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frozen install and bounded verification
        run: make toolchain-gate
      - name: Preserve machine-readable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-toolchain-report
          path: artifacts/toolchain/gate.json
          if-no-files-found: error
